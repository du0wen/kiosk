[package]
name = "kiosk-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/du0wen/kiosk"
publish = false

[[bin]]
name = "kiosk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["derive", "help", "std", "usage"] }
base64 = "0.23"
percent-encoding = "2.3"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.1"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"

[profile.dist]
inherits = "release"
lto = "thin"
