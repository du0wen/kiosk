<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <linearGradient id="kiosk-bg-lg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="kiosk-card-lg" x1="45" y1="45" x2="135" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="42" fill="url(#kiosk-bg-lg)"/>
  
  <!-- Outer Window Shell / Kiosk Frame -->
  <rect x="31" y="34" width="118" height="112" rx="16" fill="#0d1014" fill-opacity="0.18" />
  <rect x="31" y="31" width="118" height="112" rx="16" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"/>
  
  <!-- Document Canvas -->
  <rect x="45" y="45" width="90" height="84" rx="11" fill="url(#kiosk-card-lg)"/>
  
  <!-- Window Header -->
  <circle cx="60" cy="59" r="5" fill="#0f766e"/>
  <circle cx="75" cy="59" r="5" fill="#14b8a6"/>
  <path d="M89 59h31" stroke="#99f6e4" stroke-width="6.5" stroke-linecap="round"/>
  
  <!-- Content Lines -->
  <rect x="60" y="76" width="60" height="9.5" rx="4.75" fill="#0f766e" fill-opacity="0.9"/>
  <rect x="60" y="93" width="42" height="8" rx="4" fill="#14b8a6" fill-opacity="0.7"/>
  <rect x="60" y="107" width="51" height="8" rx="4" fill="#14b8a6" fill-opacity="0.5"/>
  
  <!-- Share / Publish Node -->
  <circle cx="132" cy="48" r="18" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
  <path d="M125 49l11-8m0 0v9m0-9h-9" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
